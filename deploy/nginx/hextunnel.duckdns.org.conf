server {
    listen 80;
    listen [::]:80;
    server_name hextunnel.duckdns.org;

    root /var/www/hextunnel-web/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/hextunnel-web.access.log;
    error_log /var/log/nginx/hextunnel-web.error.log;

    include /etc/nginx/snippets/hextunnel-security-headers.conf;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|ico|woff2?|mp4|webm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
