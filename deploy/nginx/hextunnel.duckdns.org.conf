server {
    listen 80;
    listen [::]:80;
    server_name hextunnel.duckdns.org;

    root /var/www/hextunnel-web/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/hextunnel-web.access.log;
    error_log /var/log/nginx/hextunnel-web.error.log;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
