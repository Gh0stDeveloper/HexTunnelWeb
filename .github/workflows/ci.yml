name: Web CI

on:
  push:
    branches: [main, "agent/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://hextunnel.duckdns.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Validate deployment assets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-vps.sh
          bash -n scripts/install-nginx-vhost.sh
          bash -n scripts/install-security-headers.sh
          bash -n scripts/rollback-vps.sh
          grep -Fq '/etc/nginx/sites-enabled' scripts/install-nginx-vhost.sh
          grep -Fq '/etc/nginx/conf.d' scripts/install-nginx-vhost.sh
          grep -Fq 'server_name hextunnel.duckdns.org;' deploy/nginx/hextunnel.duckdns.org.conf
          grep -Fq '/var/www/hextunnel-web/current' deploy/nginx/hextunnel.duckdns.org.conf
          grep -Fq 'Content-Security-Policy-Report-Only' deploy/nginx/hextunnel-security-headers.conf
          grep -Fq 'Strict-Transport-Security' deploy/nginx/hextunnel-security-headers.conf
          grep -Fq 'hextunnel-web-update' scripts/deploy-vps.sh
      - name: Validate static export
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f out/index.html
          test -f out/caracteristicas/index.html
          test -f out/compatibilidad/index.html
          test -f out/documentacion/index.html
          test -f out/documentacion/requisitos/index.html
          test -f out/documentacion/compatibilidad/index.html
          test -f out/documentacion/preparar-vps/index.html
          test -f out/documentacion/arquitecturas/index.html
          test -f out/documentacion/actualizaciones/index.html
          test -f out/documentacion/respaldos/index.html
          test -f out/documentacion/solucion-de-problemas/index.html
          test -f out/galeria/index.html
          test -f out/novedades/index.html
          test -f out/novedades/1-0-0-rc-3/index.html
          test -f out/hoja-de-ruta/index.html
          test -f out/soporte/index.html
          test -f out/desarrolladores/index.html
          test -f out/preguntas/index.html
          test -f out/privacidad/index.html
          test -f out/terminos/index.html
          test -f out/uso-aceptable/index.html
          test -f out/seguridad/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/media/screenshot-placeholder.svg
          test -f out/media/profile-placeholder.svg
          grep -Fq 'https://hextunnel.duckdns.org' out/sitemap.xml
          grep -Fq 'SoftwareApplication' out/index.html
          grep -Fq 'FAQPage' out/preguntas/index.html
          grep -Fq 'Gh0stDeveloper' out/soporte/index.html
          grep -Fq 'Jotchua DevzZ' out/soporte/index.html
          ! grep -REni 'ghostdeveloperlicenseserver|telebotgen|127\.0\.0\.1:8080|admin[_ -]?token|private[_ -]?key|sqlite|/etc/ghostdeveloper-license' out --include='*.html'
