<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Captura pendiente de Hex Tunnel</title>
  <desc id="description">Reemplaza este recurso subiendo la captura WebP indicada en la documentación.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102331"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79a7ff"/>
      <stop offset="1" stop-color="#52e5d4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" rx="44" fill="url(#bg)"/>
  <rect x="170" y="150" width="1260" height="700" rx="30" fill="#0d1b27" stroke="#2d4b5e" stroke-width="4"/>
  <rect x="170" y="150" width="1260" height="92" rx="30" fill="#122937"/>
  <circle cx="225" cy="196" r="13" fill="#ff8b9a"/>
  <circle cx="270" cy="196" r="13" fill="#f1c56c"/>
  <circle cx="315" cy="196" r="13" fill="#54d6a1"/>
  <rect x="245" y="330" width="360" height="320" rx="24" fill="#102331" stroke="#203747"/>
  <rect x="650" y="330" width="700" height="70" rx="18" fill="#102331"/>
  <rect x="650" y="440" width="210" height="150" rx="18" fill="#102331"/>
  <rect x="895" y="440" width="210" height="150" rx="18" fill="#102331"/>
  <rect x="1140" y="440" width="210" height="150" rx="18" fill="#102331"/>
  <rect x="650" y="630" width="700" height="95" rx="18" fill="#102331"/>
  <rect x="650" y="760" width="410" height="14" rx="7" fill="url(#accent)"/>
  <text x="800" y="895" fill="#c3d0da" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">Captura pendiente</text>
  <text x="800" y="938" fill="#9db0bf" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">Sube el archivo WebP con el nombre indicado</text>
</svg>
